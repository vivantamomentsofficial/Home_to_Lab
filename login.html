<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Home to Lab (CloudVault)</title>
    
    <!-- SEO Optimization -->
    <meta name="description" content="Log in to your CloudVault (Home to Lab) account to access your personal cloud storage, download your files, and retrieve your clipboard notes.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://hometolab.vercel.app/login">

    <!-- Favicon Links for Premium Browsers and Google Search Engine -->
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="alternate icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="alternate icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="alternate icon" type="image/png" sizes="48x48" href="assets/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
    <link rel="shortcut icon" href="assets/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="css/style.css?v=2.0.0">
    <link rel="stylesheet" href="css/responsive.css?v=2.0.0">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Cloudflare Turnstile CAPTCHA SDK -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }
        .auth-card {
            padding: 40px;
            animation: scaleUp var(--transition-normal) forwards;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-logo {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .auth-logo i {
            color: var(--primary);
        }
        .auth-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-link {
            color: var(--accent);
            font-weight: 600;
        }
        .auth-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }
        .flex-row-between {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .forgot-link {
            font-size: 13px;
            color: var(--text-muted);
        }
        .forgot-link:hover {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Return to Home Link -->
        <a href="home" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-muted); margin-bottom: 15px; font-weight: 500; transition: color var(--transition-fast);" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='var(--text-muted)'">
            <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
            <span>Return to Home Page</span>
        </a>
        <div class="glass-card auth-card">
            <div class="auth-header">
                <a href="home" class="auth-logo" style="display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <div style="background: rgba(14, 165, 233, 0.08); width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: var(--primary); flex-shrink: 0;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    </div>
                    <span>CloudVault</span>
                </a>
                <div class="auth-subtitle">Sign in to access your lab files and clipboard</div>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">College / Personal Email</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <i data-lucide="mail" style="width: 18px; height: 18px;"></i>
                        </span>
                        <input type="email" id="email" class="form-input" placeholder="you@university.edu" required autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <i data-lucide="lock" style="width: 18px; height: 18px;"></i>
                        </span>
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div class="flex-row-between">
                    <label class="form-checkbox">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Remember Me</span>
                    </label>
                    <a href="#" id="forgot-password-link" class="forgot-link">Forgot Password?</a>
                </div>

                <!-- Cloudflare Turnstile CAPTCHA Widget -->
                <div class="cf-turnstile" data-sitekey="0x4AAAAAAAEK3i3q8cw05m9-C" style="margin-bottom: 20px; display: flex; justify-content: center;"></div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <span>Login</span>
                    <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="register" class="auth-link">Register here</a>
            </div>
        </div>
        
        <!-- Developer Attribution Footer -->
        <div style="text-align: center; margin-top: 25px; font-size: 13px; color: var(--text-muted); animation: fadeInUp 0.8s ease;">
            Developed by <a href="https://aayushparekhportfolio.vercel.app/" target="_blank" rel="noopener noreferrer" style="color: var(--primary); font-weight: 500; text-decoration: underline;">Aayush Parekh</a>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container"></div>

    <!-- Supabase Client SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Configurations -->
    <script src="js/supabase.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Initialize Lucide Icons after loading
        lucide.createIcons();
    </script>
</body>
</html>
